name: AI Video Production

on:
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip' # تفعيل الكاش للمكتبات تلقائياً

    # بدل التحميل الطويل، بنستخدم نسخة جاهزة وسريعة
    - name: Ensure FFmpeg is present
      run: |
        if ! command -v ffmpeg &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y ffmpeg
        else
          echo "FFmpeg is already installed"
        fi

    - name: Install Python Packages
      run: |
        pip install requests groq gTTS "moviepy==1.0.3"

    - name: Run Factory
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        DAILYMOTION_API_KEY: ${{ secrets.DAILYMOTION_API_KEY }}
        DAILYMOTION_API_SECRET: ${{ secrets.DAILYMOTION_API_SECRET }}
        DM_USER: ${{ secrets.DM_USER }}
        DM_PASS: ${{ secrets.DM_PASS }}
      run: python video_factory.py
