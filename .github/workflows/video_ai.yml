name: AI Video Factory

on:
  schedule:
    - cron: '0 1 * * *' # يشتغل مرة يومياً الساعة 12 ظهراً
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Tools
      run: |
        sudo apt-get install -y ffmpeg
        pip install requests groq gTTS moviepy

    - name: Run Factory
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        DAILYMOTION_API_KEY: ${{ secrets.DAILYMOTION_API_KEY }}
        DAILYMOTION_API_SECRET: ${{ secrets.DAILYMOTION_API_SECRET }}
        DM_USER: ${{ secrets.DM_USER }}
        DM_PASS: ${{ secrets.DM_PASS }}
      run: python video_factory.py
