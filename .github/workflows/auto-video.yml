name: Auto Video Generator
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # تشغيل يومي الساعة 09:00 UTC (عدل حسب رغبتك)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
         sudo apt-get update
         sudo apt-get install -y ffmpeg
         python -m pip install --upgrade pip
         python -m pip install moviepy==2.0.0 imageio imageio-ffmpeg requests gtts tqdm

      - name: Debug installed moviepy
        run: |
         python -c "import sys; print('PYTHON:', sys.executable)"
         python -c "import moviepy; print('moviepy version:', getattr(moviepy,'__version__',None))"
         python -c "import pkgutil, moviepy; print('moviepy modules:', [m.name for m in pkgutil.iter_modules(moviepy.__path__)])"
         python -c "import moviepy.editor as me; print('editor ok', hasattr(me,'VideoFileClip'))" || true
      - name: Quick import test
        run: |
         python -c "from moviepy.video.io.VideoFileClip import VideoFileClip; print('VideoFileClip OK')"
         python -c "from moviepy.audio.io.AudioFileClip import AudioFileClip; print('AudioFileClip OK')"

      - name: Run script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API: ${{ secrets.PEXELS_API }}
          DM_API_KEY: ${{ secrets.DM_API_KEY }}
          DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
          DM_USER: ${{ secrets.DM_USER }}
          DM_PASS: ${{ secrets.DM_PASS }}
        run: |
          python main.py
